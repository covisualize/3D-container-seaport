<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183b3d">
  <meta name="description" content="Explore Halvard harbour. A living, entirely procedural seaport built with Three.js in a single file.">
  <title>Aurora Strait — Halvard Harbour</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23183b3d'/%3E%3Cpath d='M16 41h32L40 51H24zM25 19v18m14-18v18M21 25h22' fill='none' stroke='%23d7efcd' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #203f40; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #aac9ce; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #scene:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
    .masthead { position: fixed; top: 30px; left: 34px; display: flex; align-items: center; gap: 13px; pointer-events: none; }
    .mark { width: 37px; height: 39px; border: 1px solid #25474760; display: grid; place-items: center; border-radius: 3px; }
    .mark svg { width: 24px; height: 24px; }
    .eyebrow { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; font-weight: 650; }
    h1 { font-size: 22px; font-weight: 500; letter-spacing: -.04em; margin: 3px 0 0; }
    .conditions { position: fixed; top: 34px; right: 34px; text-align: right; pointer-events: none; }
    .conditions .weather { margin-top: 9px; font: 11px ui-monospace, monospace; opacity: .8; }
    .dot { display: inline-block; width: 5px; height: 5px; background: #416c55; border-radius: 50%; margin-right: 7px; vertical-align: 2px; }
    .bottom { position: fixed; left: 34px; right: 34px; bottom: 28px; display: flex; align-items: end; justify-content: space-between; gap: 16px; pointer-events: none; }
    .caption { color: #eaf5f0; text-shadow: 0 1px 12px #103a40a0; }
    .caption strong { display: block; font-size: 14px; font-weight: 450; letter-spacing: .01em; margin-bottom: 7px; }
    .caption span { font-size: 10px; letter-spacing: .05em; opacity: .85; }
    .toolbar { display: flex; gap: 4px; align-items: center; padding: 7px; background: #f4f7ede8; border: 1px solid #ffffffa0; border-radius: 9px; box-shadow: 0 4px 30px #102c3a18; backdrop-filter: blur(16px); pointer-events: auto; }
    button, select { font: inherit; font-size: 11px; color: #244444; border: 0; border-radius: 5px; background: transparent; min-height: 34px; cursor: pointer; }
    button { padding: 0 12px; white-space: nowrap; }
    button:hover, select:hover { background: #dbe5da; }
    button:focus-visible, select:focus-visible { outline: 2px solid #3f7372; outline-offset: 1px; }
    .orbit { display: flex; gap: 7px; align-items: center; font-size: 11px; padding: 0 12px; min-height: 34px; }
    .orbit svg { width: 16px; height: 16px; }
    .divider { height: 21px; width: 1px; background: #ced8ce; margin: 0 3px; }
    label { font-size: 9px; color: #607673; padding-left: 9px; }
    select { padding: 0 21px 0 5px; }
    .icon-button { font-size: 17px; width: 35px; padding: 0; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #d4e4e4; z-index: 5; transition: opacity .65s; padding: 32px; }
    #loading h2 { font-size: 30px; font-weight: 450; letter-spacing: -.04em; margin: 15px 0; }
    #loading p { font-size: 12px; line-height: 1.8; max-width: 420px; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #status { position: fixed; top: 95px; right: 34px; max-width: 300px; font-size: 11px; background: #f2f5ecee; border-radius: 5px; padding: 10px 14px; display: none; }
    .night .masthead,.night .conditions {color:#dfebe5;}
    .night .mark {border-color:#c8dfd780;}
    .time-control {position:fixed;top:26px;left:50%;transform:translateX(-50%);width:230px;padding:10px 14px;background:#f4f7ede8;border:1px solid #ffffff80;border-radius:9px;backdrop-filter:blur(16px);}
    .time-control label {display:block;text-align:center;padding:0;font:9px ui-monospace,monospace;letter-spacing:.08em;}
    #time {width:100%;height:16px;margin:6px 0 0;accent-color:#337e7a;cursor:pointer;}
    .time-presets {display:flex;justify-content:space-between;gap:3px;}
    .time-presets button {font-size:9px;min-height:23px;padding:0 4px;}
    @media (max-width: 850px) {.time-control {top:109px;width:215px;}}
    @media (max-width: 650px) {
      .masthead { top: 20px; left: 20px; } h1 { font-size: 20px; }
      .conditions { right: 20px; top: 82px; } .conditions .weather { display: none; }
      .bottom { left: 16px; right: 16px; bottom: 18px; flex-direction: column; align-items: start; gap: 16px; }
      .toolbar { align-self: stretch; justify-content: space-between; } .caption span { font-size: 9px; }
      .orbit { padding: 0 6px; gap: 5px; } .toolbar button { padding: 0 8px; }
      .toolbar label { padding-left: 2px; } .toolbar select { padding-right: 15px; }
      .toolbar .divider { margin: 0; }
      .caption strong { font-size: 12px; } .eyebrow { font-size: 8px; }
      #status { right: 20px; }
    }
    .sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
    #touch-move {position:fixed;left:20px;bottom:145px;padding:6px;background:#f4f7ede8;border-radius:8px;}
    #touch-move button {min-width:38px;min-height:42px;touch-action:none;font-size:19px;}
    [hidden] {display:none!important;}
    .caption {max-width:400px;}.caption span {display:block;line-height:1.6;}
    #camera-mode {max-width:130px;}
    @media (max-width:650px) {.toolbar {flex-wrap:wrap;justify-content:center;gap:4px;}.toolbar .divider{display:none;} .caption{max-width:100%;}.caption strong{display:none;}#camera-mode{max-width:100px;} .toolbar label{font-size:8px;} .toolbar button{padding:0 6px;} #touch-move{bottom:220px;}}
    @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
  </style>
  <script>
    const assetHost=new URLSearchParams(location.search).get('cdn')==='unpkg'?'https://unpkg.com/three@0.170.0/':'https://cdn.jsdelivr.net/npm/three@0.170.0/';
    const map=document.createElement('script');map.type='importmap';map.textContent=JSON.stringify({imports:{three:assetHost+'build/three.module.js','three/addons/':assetHost+'examples/jsm/'}});document.currentScript.after(map);
  </script>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="Interactive 3D Halvard harbour. Drag to orbit, scroll to zoom, right-drag to pan. Arrow keys pan when focused."></canvas>
  <header class="masthead">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 22h20l-5 5H11zM11 7v12m10-12v12M8 11h16M16 4v18"/></svg></div>
    <div><div class="eyebrow">Halvard · North Terminal</div><h1>Aurora Strait</h1></div>
  </header>
  <aside class="conditions"><div class="eyebrow"><span class="dot"></span>Halvard / Live</div><div class="weather">DAYLIGHT &nbsp; / &nbsp; CALM SEA</div></aside>
  <section class="time-control" aria-label="Time of day">
    <label for="time" id="time-label">12:00 · DAYLIGHT</label>
    <input id="time" type="range" min="5" max="23" step="0.05" value="12" aria-label="Time of day">
    <div class="time-presets"><button data-hour="6">Dawn</button><button data-hour="12">Midday</button><button data-hour="18">Sunset</button><button data-hour="22">Night</button></div>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
  <footer class="bottom">
    <div class="caption"><strong>Aurora Strait · Berth 01</strong><span id="camera-help">Drag to orbit · Scroll to zoom · Right-drag to pan</span></div>
    <nav class="toolbar" aria-label="Scene controls">
      <label class="sr-only" for="camera-mode">Camera mode</label><select id="camera-mode" aria-label="Camera mode"><option value="orbit">Orbit</option><option value="drone">Drone</option><option value="walk">Walk</option><option value="tour">Cinematic tour</option></select>
      <div class="divider"></div>
      <label for="quality">QUALITY</label><select id="quality" aria-label="Render quality"><option value="high">High</option><option value="low">Low</option></select>
      <div class="divider"></div>
      <button id="reset" title="Return to the harbour overview">Reset view</button>
      <button id="sound" aria-label="Enable ambient sound" aria-pressed="false">Sound off</button>
      <button id="fullscreen" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
    </nav>
  </footer>
  <div id="touch-move" hidden aria-label="Movement controls">
    <button data-move="KeyW" aria-label="Move forward">↑</button><button data-move="KeyA" aria-label="Move left">←</button><button data-move="KeyS" aria-label="Move backward">↓</button><button data-move="KeyD" aria-label="Move right">→</button><button data-move="KeyQ" data-vertical aria-label="Fly down">−</button><button data-move="KeyE" data-vertical aria-label="Fly up">+</button>
  </div>
  <div id="loading" role="status"><div class="eyebrow">Halvard / North Terminal</div><h2>Opening the strait.</h2><p id="loading-message">Preparing the harbour and its cargo…</p></div>
  <noscript>This harbour needs JavaScript and a browser with WebGL 2 support.</noscript>
  <script type="module">
    // A single-file scene. Every texture and piece of geometry is generated here.
    // Coordinates are metres: +Y up; quay runs along Z, water is west (-X).
    const loading = document.querySelector('#loading');
    const loadingMessage = document.querySelector('#loading-message');
    const mobileDevice=matchMedia('(pointer:coarse)').matches||innerWidth<650;
    const safeMode=mobileDevice||new URLSearchParams(location.search).has('safe');
    function fail(error) {
      console.error(error);
      loading.classList.remove('hidden');
      loading.querySelector('h2').textContent = 'The harbour could not open.';
      const detail=String(error?.message||error);
      if(/fetch|import|module|network/i.test(detail)&&new URLSearchParams(location.search).get('cdn')!=='unpkg'){
        loading.querySelector('h2').textContent='Trying another connection…';
        const url=new URL(location.href);url.searchParams.set('cdn','unpkg');location.replace(url.href);return;
      }
      loadingMessage.textContent='Startup error: '+detail+'.';
      if(!document.querySelector('#retry-harbour')){
        const retry=document.createElement('button');retry.id='retry-harbour';retry.textContent='Retry in compatibility mode';
        retry.onclick=()=>{const url=new URL(location.href);url.searchParams.set('safe','1');url.searchParams.set('retry',Date.now());location.replace(url.href);};loading.append(retry);
      }
    }
    try {
      const [THREE, { OrbitControls }, { Water }, { Sky }, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }, { ShaderPass }, { FXAAShader }] = await Promise.all([
        import('three'), import('three/addons/controls/OrbitControls.js'),
        import('three/addons/objects/Water.js'), import('three/addons/objects/Sky.js'),
        import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js'),
        import('three/addons/postprocessing/ShaderPass.js'), import('three/addons/shaders/FXAAShader.js')
      ]);
      const canvas = document.querySelector('#scene');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: !safeMode, powerPreference: safeMode?'default':'high-performance' });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.85;
      renderer.shadowMap.enabled = true;
      renderer.info.autoReset = false;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      // Static phase: render the shadow atlas once; future moving cranes will invalidate it.
      renderer.shadowMap.autoUpdate = false;
      renderer.shadowMap.needsUpdate = true;
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xb6cdd0, 0.00029);
      const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.6, 16000);
      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.minDistance = 18;
      controls.maxDistance = 1350;
      controls.maxPolarAngle = Math.PI / 2 - 0.022;
      controls.minPolarAngle = 0.1;
      controls.maxTargetRadius = 560;
      controls.screenSpacePanning = false;
      controls.listenToKeyEvents(canvas);
      function resetView() {
        // Drain any orbit inertia before restoring a deterministic home pose.
        controls.enableDamping=false;controls.update();
        camera.position.set(...(innerWidth/innerHeight<.8?[-355,205,430]:[-285,145,355]));
        controls.target.set(65, 18, -12);
        controls.cursor.set(65, 18, -12);
        controls.update();
        controls.enableDamping=true;
      }
      resetView();

      // Seeded randomness makes the harbour identical on every reload.
      let seed = 1847;
      function random() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
      const anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      function canvasTexture(width, height, paint, color = true) {
        const c = document.createElement('canvas'); c.width = width; c.height = height;
        const ctx = c.getContext('2d'); paint(ctx, width, height);
        const texture = new THREE.CanvasTexture(c);
        if (color) texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.anisotropy = anisotropy;
        return texture;
      }
      const concrete = canvasTexture(1024, 1024, (ctx, w, h) => {
        ctx.fillStyle = '#969a94'; ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 95000; i++) {
          const v = 90 + Math.floor(random() * 100);
          ctx.fillStyle = `rgba(${v},${v},${v-5},${0.06+random()*0.19})`;
          ctx.fillRect(random()*w, random()*h, 1+random()*3, 1+random()*3);
        }
        for (let i = 0; i < 70; i++) {
          const x = random()*w, y = random()*h, r = 15+random()*90;
          const g = ctx.createRadialGradient(x,y,0,x,y,r);
          g.addColorStop(0, '#58605b0c'); g.addColorStop(1, '#58605b00');
          ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
        }
        ctx.strokeStyle = '#545d5948'; ctx.lineWidth = 2;
        for (let i = 0; i <= 4; i++) {
          ctx.beginPath(); ctx.moveTo(i*w/4,0); ctx.lineTo(i*w/4,h); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0,i*h/4); ctx.lineTo(w,i*h/4); ctx.stroke();
        }
        ctx.strokeStyle = '#52595540'; ctx.lineWidth = .8;
        for(let i=0;i<18;i++) {
          let x=random()*w,y=random()*h; ctx.beginPath();ctx.moveTo(x,y);
          for(let j=0;j<5;j++){x+=random()*18-9;y+=random()*16;ctx.lineTo(x,y);}ctx.stroke();
        }
      });
      concrete.repeat.set(5, 15);
      const wallTexture = canvasTexture(512, 256, (ctx,w,h) => {
        ctx.fillStyle = '#888e87'; ctx.fillRect(0,0,w,h);
        for(let i=0;i<8000;i++) {
          ctx.fillStyle = `rgba(36,51,43,${random()*.12})`;
          ctx.fillRect(random()*w,random()*h,1+random()*4,random()*18);
        }
        const g=ctx.createLinearGradient(0,0,0,h);
        g.addColorStop(0,'#172e1b00');g.addColorStop(.55,'#172e1b08');g.addColorStop(1,'#172e1bc0');
        ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#34443e40';ctx.fillRect(0,0,3,h);
      });
      wallTexture.repeat.set(45,1);
      const stripes = canvasTexture(256,128,(ctx,w,h)=>{
        ctx.fillStyle='#d4ac3d';ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#252e2c';
        for(let x=-256;x<512;x+=128){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+64,0);ctx.lineTo(x+128,h);ctx.lineTo(x+64,h);ctx.closePath();ctx.fill();}
        for(let i=0;i<6000;i++){ctx.fillStyle=random()>.5?'#a5aa9440':'#17232122';ctx.fillRect(random()*w,random()*h,random()*3,random()*3);}
      });
      stripes.repeat.set(120,1);

      // Analytic, tileable normal field; no normal-map image is downloaded.
      const waterNormals = canvasTexture(256,256,(ctx,w,h)=>{
        const data=ctx.createImageData(w,h),field=new Float32Array(w*h);
        // Tileable fractal value noise avoids coherent sine-wave interference patterns.
        for(const [cells,amplitude] of [[4,1],[8,.5],[16,.25],[32,.12],[64,.06]]){
          const grid=Float32Array.from({length:cells*cells},()=>random()*2-1);
          const at=(x,y)=>grid[(y%cells)*cells+x%cells];
          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            const gx=x/w*cells,gy=y/h*cells,ix=Math.floor(gx),iy=Math.floor(gy);
            const fx=gx-ix,fy=gy-iy,tx=fx*fx*(3-2*fx),ty=fy*fy*(3-2*fy);
            const a=THREE.MathUtils.lerp(at(ix,iy),at(ix+1,iy),tx);
            const b=THREE.MathUtils.lerp(at(ix,iy+1),at(ix+1,iy+1),tx);
            field[y*w+x]+=THREE.MathUtils.lerp(a,b,ty)*amplitude;
          }
        }
        const at=(x,y)=>field[((y+h)%h)*w+(x+w)%w];
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const dx=(at(x+1,y)-at(x-1,y))*1.3,dy=(at(x,y+1)-at(x,y-1))*1.3;
          const n=new THREE.Vector3(-dx,-dy,1).normalize();const i=(y*w+x)*4;
          data.data[i]=(n.x*.5+.5)*255;data.data[i+1]=(n.y*.5+.5)*255;
          data.data[i+2]=(n.z*.5+.5)*255;data.data[i+3]=255;
        }
        ctx.putImageData(data,0,0);
      },false);

      // Physical daylight and sky-derived image-based lighting for PBR surfaces.
      const sunDirection = new THREE.Vector3(-.48,.64,-.60).normalize();
      const sky = new Sky(); sky.scale.setScalar(12000);
      Object.assign(sky.material.uniforms.turbidity,{value:4.8});
      sky.material.uniforms.rayleigh.value=1.65;
      sky.material.uniforms.mieCoefficient.value=.006;
      sky.material.uniforms.mieDirectionalG.value=.82;
      sky.material.uniforms.sunPosition.value.copy(sunDirection);
      scene.add(sky);
      const environmentScene = new THREE.Scene();
      const environmentSky = sky.clone(); environmentScene.add(environmentSky);
      const pmrem = new THREE.PMREMGenerator(renderer);
      let environment = pmrem.fromScene(environmentScene, .04, .1, 20000);
      scene.environment=environment.texture; scene.environmentIntensity=.65;
      // Reuse PMREM for debounced time-of-day environment updates.
      const sun = new THREE.DirectionalLight(0xfff3d9, 3.1);
      sun.position.copy(sunDirection).multiplyScalar(750);
      sun.target.position.set(100,0,0);
      sun.castShadow=true;
      sun.shadow.mapSize.set(2048,2048);
      Object.assign(sun.shadow.camera,{left:-420,right:420,top:420,bottom:-420,near:50,far:1600});
      sun.shadow.normalBias=.07;sun.shadow.bias=-.00015;sun.shadow.radius=3;
      scene.add(sun,sun.target,new THREE.HemisphereLight(0xddeff5,0x69776a,1.3));

      // Deep-water dispersion: the renderer and buoyancy solver share amplitudes,
      // wave numbers and angular frequencies (omega² = g k, metres and seconds).
      const gravity=9.81;
      const swellWaves=[
        {a:.105,k:2*Math.PI/36,dx:.86,dz:.5103,phase:.3},
        {a:.060,k:2*Math.PI/18,dx:-.25,dz:.96825,phase:1.7},
        {a:.025,k:2*Math.PI/9.2,dx:.5,dz:-.866025,phase:3.1}
      ];
      for(const wave of swellWaves)wave.omega=Math.sqrt(gravity*wave.k);
      function seaHeight(x,z,time){
        let h=.02;for(const w of swellWaves)h+=w.a*Math.sin(w.k*(w.dx*x+w.dz*z)-w.omega*time+w.phase);return h;
      }
      const waveGLSL=`
        vec3 seaField(vec2 p,float t){
          vec3 field=vec3(0.0);
          ${swellWaves.map(w=>`{float phase=${w.k.toFixed(8)}*dot(p,vec2(${w.dx.toFixed(7)},${w.dz.toFixed(7)}))-${w.omega.toFixed(8)}*t+${w.phase.toFixed(7)};
          field.x+=${w.a.toFixed(7)}*sin(phase);field.yz+=${(w.a*w.k).toFixed(8)}*cos(phase)*vec2(${w.dx.toFixed(7)},${w.dz.toFixed(7)});}`).join('\n')}
          return field;
        }`;
      // Concentric grid gives the near harbour actual wave displacement without
      // spending fine triangles at the horizon. No third-party geometry assets.
      const seaSegments=safeMode?96:160,seaRings=safeMode?64:112,seaVertices=[-90,0,0],seaIndices=[];
      for(let j=1;j<=seaRings;j++){
        const radius=j<seaRings*.76?j*7:seaRings*.76*7+Math.pow((j-seaRings*.76)/(seaRings*.24),2)*16500;
        for(let i=0;i<seaSegments;i++){const a=i/seaSegments*Math.PI*2;seaVertices.push(-90+Math.cos(a)*radius,Math.sin(a)*radius,0);}
      }
      for(let i=0;i<seaSegments;i++)seaIndices.push(0,1+i,1+(i+1)%seaSegments);
      for(let j=1;j<seaRings;j++)for(let i=0;i<seaSegments;i++){
        const a=1+(j-1)*seaSegments+i,b=1+(j-1)*seaSegments+(i+1)%seaSegments,c=a+seaSegments,d=b+seaSegments;
        seaIndices.push(a,c,b,b,c,d);
      }
      const waterGeometry=new THREE.BufferGeometry();waterGeometry.setAttribute('position',new THREE.Float32BufferAttribute(seaVertices,3));waterGeometry.setIndex(seaIndices);waterGeometry.computeVertexNormals();
      const waters = {};
      for(const [quality,size] of [['high',safeMode?512:1024],['low',safeMode?256:512]]){
        const sea=new Water(waterGeometry,{textureWidth:size,textureHeight:size,waterNormals,
          sunDirection,sunColor:0xfff2d8,waterColor:0x10575b,distortionScale:.7,fog:true});
        sea.rotation.x=-Math.PI/2;sea.position.y=.02;
        sea.material.uniforms.size.value=1.25;
        sea.material.vertexShader=waveGLSL+sea.material.vertexShader
          .replace('worldPosition = mirrorCoord.xyzw;',`mirrorCoord.y += seaField(mirrorCoord.xz,time).x;worldPosition = mirrorCoord.xyzw;`)
          .replace('vec4 mvPosition =  modelViewMatrix * vec4( position, 1.0 );','vec4 mvPosition = viewMatrix * worldPosition;');

        const swell=ctx.createOscillator(),swellGain=ctx.createGain();swell.frequency.value=.085;swellGain.gain.value=.19;swell.connect(swellGain);swellGain.connect(waveGain.gain);swell.start();
        const motor=ctx.createOscillator(),motorFilter=ctx.createBiquadFilter();motor.type='sawtooth';motor.frequency.value=62;motorFilter.type='lowpass';motorFilter.frequency.value=180;
        sound.motorGain=ctx.createGain();sound.motorGain.gain.value=0;motor.connect(motorFilter);motorFilter.connect(sound.motorGain);sound.motorGain.connect(sound.master);motor.start();
        sound.nextGull=ctx.currentTime+2;sound.nextHorn=ctx.currentTime+9;
        sound.timer=setInterval(()=>{
          if(sound.muted||document.hidden||ctx.state!=='running')return;
          const now=ctx.currentTime;
          if(now>sound.nextGull){synthTone(1300+random()*500,.65,.055,'sine',random()*1.6-.8,650+random()*400);sound.nextGull=now+5+random()*8;}
          if(now>sound.nextHorn){synthTone(73,3.7,.11,'triangle',-.35,70);synthTone(110,3.4,.045,'sine',-.35,105);sound.nextHorn=now+30+random()*25;}
          const handling=craneLoads.some(load=>load.state==='return truck delivery'&&load.speed>.1);
          if(handling&&now>sound.nextBeep){synthTone(870,.17,.04,'sine',.4);sound.nextBeep=now+1.2;}
          const distance=Math.hypot(camera.position.x-85,camera.position.z),moving=craneLoads.some(load=>['lift','transfer','hoist clear'].includes(load.state.replace('return ','')));
          sound.motorGain.gain.setTargetAtTime(moving?.12/(1+distance/130):.015,now,.4);
        },250);
      }
      async function setMuted(muted){
        if(!muted&&!sound.context)startAudioGraph();sound.muted=muted;
        if(sound.context){
          if(muted){sound.master.gain.cancelScheduledValues(sound.context.currentTime);sound.master.gain.setValueAtTime(0,sound.context.currentTime);for(const voice of sound.voices){try{voice.stop();}catch{}}await sound.context.suspend();}
          else{await sound.context.resume();sound.master.gain.setTargetAtTime(.32,sound.context.currentTime,.15);}
        }
        const button=document.querySelector('#sound');button.textContent=muted?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(!muted));button.setAttribute('aria-label',muted?'Enable ambient sound':'Mute ambient sound');
      }
      document.querySelector('#sound').addEventListener('click',()=>setMuted(!sound.muted).catch(()=>{sound.muted=true;showNotice('Audio could not start. Try the sound button again in a supported browser.');}));
      document.addEventListener('visibilitychange',()=>{
        pressed.clear();looking=false;
        if(sound.context){if(document.hidden)sound.context.suspend();else if(!sound.muted)sound.context.resume().catch(()=>{});}
      });
      // Static mesh transforms are baked once. Moving groups and instance matrices remain live.
      scene.traverse(object=>{if(object.isMesh){object.updateMatrix();object.matrixAutoUpdate=false;}});
      for(const sea of Object.values(waters)){
        const reflect=sea.onBeforeRender;let reflected=false;
        sea.onBeforeRender=function(...args){if(quality==='low'&&reflected&&frameCount%2===1)return;reflect.apply(this,args);reflected=true;};
      }

      document.querySelector('#reset').addEventListener('click',()=>{setCameraMode('orbit');resetView();});
      document.querySelector('#fullscreen').addEventListener('click',async()=>{
        try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
        catch{const s=document.querySelector('#status');s.textContent='Fullscreen is unavailable in this browser view.';s.style.display='block';setTimeout(()=>s.style.display='none',4000);}
      });
      document.addEventListener('fullscreenchange',()=>document.querySelector('#fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen'));
      window.addEventListener('resize',resize);
      canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();renderer.setAnimationLoop(null);fail(new Error('WebGL context lost'));});
      canvas.addEventListener('webglcontextrestored',()=>location.reload());
      const clock=new THREE.Clock();let seaTime=0,frameCount=0;
      const metrics={phase:6,quality,frames:0,drawCalls:0,triangles:0,fps:0};let frameAverage=1/60;
      // Read-only inspection point for browser verification; not a runtime dependency.
      Object.defineProperty(window,'harbourDiagnostics',{get:()=>({...metrics,camera:camera.position.toArray(),target:controls.target.toArray(),reflectionSize:quality==='high'?(safeMode?512:1024):(safeMode?256:512),safeMode,instancedMeshes:(()=>{let count=0;scene.traverse(x=>{if(x.isInstancedMesh)count++;});return count;})(),containerCount:containerSlots.length,containerBatches:containerBatches.length+containerDetailBatches.length,detailedContainers:containerDetailBatches.reduce((n,m)=>n+m.count,0),containerDetail,shipName:ship.name,quayCranes:craneStations.length,yardContainers:yardContainerCount,simulationTime,physicsSteps,fixedStep,waveHeight:seaHeight(0,0,simulationTime),cameraMode,audioMuted:sound.muted,audioState:sound.context?.state||'not started',audioVoices:sound.voices.size,timeOfDay,nightAmount,activeFloodlights:floodLights.filter(l=>l.intensity>0).length,beaconIntensity:beacon.intensity,windowEmission:glass.emissiveIntensity,craneCycles:craneLoads.map(l=>({state:l.state,owner:l.owner,x:l.x,y:l.y,truck:l.truck.toArray(),sway:l.sway,speed:l.speed,phase:l.phase})),boats:boatRoutes.map(r=>({name:r.boat.name,position:r.boat.position.toArray(),speed:r.speed,roll:r.boat.rotation.z,pitch:r.boat.rotation.x,heading:r.heading,wakeSamples:r.history.length}))})});
      renderer.setAnimationLoop(()=>{
        const elapsed=clock.getDelta(),dt=Math.min(elapsed,.1);
        if(elapsed>0){frameAverage=frameAverage*.95+elapsed*.05;metrics.fps=Math.round(1/frameAverage);}
        if(document.hidden)return;
        updateSimulation(dt);
        water.material.uniforms.time.value=simulationTime;
        updateCamera(dt);
        // Keep the camera above sea level and above the quay when zooming close.
        const overQuay=camera.position.x>59&&camera.position.x<241&&Math.abs(camera.position.z)<301;
        if(cameraMode==='orbit')camera.position.y=Math.max(camera.position.y,overQuay?5:1.8);
        updateContainerDetail(quality==='high');
        renderer.info.reset();
        composer.render();
        frameCount++;metrics.frames=frameCount;metrics.quality=quality;
        metrics.drawCalls=renderer.info.render.calls;metrics.triangles=renderer.info.render.triangles;
        if(frameCount===2){loading.classList.add('hidden');document.body.dataset.ready='true';}
      });
    } catch(error) { fail(error); }
  </script>
